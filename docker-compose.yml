x-postgres-db: &postgres-db
  image: ghcr.io/opexdev/postgres-opex
  environment:
    - POSTGRES_USER=${DB_USER:-opex}
    - POSTGRES_PASSWORD=${DB_PASS:-hiopex}
    - POSTGRES_DB=${DB_USER:-opex}
    - POSTGRES_READ_ONLY_USER=${DB_READ_ONLY_USER:-opex_reader}
    - POSTGRES_READ_ONLY_PASSWORD=${DB_READ_ONLY_PASS:-hiopex}
  networks:
    - default
  deploy:
    restart_policy:
      condition: on-failure

version: '3.8'
services:
  storage:
    image: ghcr.io/opexdev/storage:latest
    environment:
      - JAVA_OPTS=-Xmx256m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      - CONSUL_HOST=consul
      - ROOT_DIR=/storage
      - SWAGGER_AUTH_URL=$KEYCLOAK_FRONTEND_URL
    volumes:
      - storage-data:/storage
    depends_on:
      - auth
      - consul
    labels:
      collect_logs: "true"
    networks:
      - default
    deploy:
      restart_policy:
        condition: on-failure

  admin:
    image: ghcr.io/opexdev/admin:dev
    environment:
      - JAVA_OPTS=-Xmx256m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      - KAFKA_IP_PORT=kafka-1:29092,kafka-2:29092,kafka-3:29092
      - CONSUL_HOST=consul
      - VAULT_HOST=vault
      - BACKEND_USER=${BACKEND_USER}
      - SWAGGER_AUTH_URL=$KEYCLOAK_FRONTEND_URL
    ports:
      - "0.0.0.0:9092:8080"
    volumes:
      - admin-data:/admin
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
      - consul
      - auth
      - vault
    labels:
      collect_logs: "true"
    networks:
      - default
    deploy:
      restart_policy:
        condition: on-failure

  ethereum-scanner:
    image: registry.gitlab.com/lam1234/chain-scanner
    ports:
      - "8880:8880"
    environment:
      REDIS_HOST: core-redis-cache-1
      REDIS_PORT: 6379
      VAULT_HOST: core-vault-1
      VAULT_PORT: 8200
      VAULT_USERID: admin
      INFURA_URL: https://sepolia.infura.io/v3/cdf66d5d54f543b0881bb5accb479d3c
      ALCHEMY_URL: https://eth-mainnet.alchemyapi.io/v2/YCO4OXGJRLvDYSTJjUdvUQ7yFIdXxUfh
      ALCHEMY_KEY: YCO4OXGJRLvDYSTJjUdvUQ7yFIdXxUfh
      ALCHEMY_ETH: https://eth-mainnet.g.alchemy.com/v2/
      ALCHEMY_POLYGON: https://polygon-mainnet.g.alchemy.com/v2/
      ALCHEMY_ARBITRUM: https://arb-mainnet.g.alchemy.com/v2/
      ALCHEMY_OPTIMISM: https://opt-mainnet.g.alchemy.com/v2/
      ANKR_URL: https://rpc.ankr.com
      ANKR_API_KEY: e2c1d921e72162502d858eba3300a5e3b20d7a7f4813bc4c5a2aeb70523e9524
      OPENKM_URL: https://sec.cmcati.vn/OpenKM
      OPENKM_USER: okmAdmin
      OPENKM_PASS: ghp_X60Gn0$dd!f@$h60vtax2f8eVB
      WALLET_PASS: CMCATI@2025sec
      BC_GATEWAY_URL: core-bc-gateway-1:8080/wallet-sync/ethereum
    depends_on:
      - vault
#      - postgres-scanner
    labels:
      collect_logs: "true"
    networks:
      - default
  postgres-wallet-transfer:
    <<: *postgres-db
    volumes:
      - wallet-generate-data:/var/lib/postgresql/data/
    ports:
      - "5435:5432"

  wallet-transfer:
    image: registry.gitlab.com/lam1234/wallet
    ports:
      - "8889:8881"
    environment:
      REDIS_HOST: core-redis-cache-1
      REDIS_PORT: 6379
      VAULT_HOST: core-vault-1
      VAULT_PORT: 8200
      VAULT_USERID: admin
      DB_IP_PORT: postgres-wallet-transfer
      INFURA_URL: https://sepolia.infura.io/v3/cdf66d5d54f543b0881bb5accb479d3c
      ALCHEMY_URL: https://eth-mainnet.alchemyapi.io/v2/YCO4OXGJRLvDYSTJjUdvUQ7yFIdXxUfh
      ALCHEMY_KEY: YCO4OXGJRLvDYSTJjUdvUQ7yFIdXxUfh
      ALCHEMY_ETH: https://eth-mainnet.g.alchemy.com/v2/
      ALCHEMY_POLYGON: https://polygon-mainnet.g.alchemy.com/v2/
      ALCHEMY_ARBITRUM: https://arb-mainnet.g.alchemy.com/v2/
      ALCHEMY_OPTIMISM: https://opt-mainnet.g.alchemy.com/v2/
      ANKR_URL: https://rpc.ankr.com
      ANKR_API_KEY: e2c1d921e72162502d858eba3300a5e3b20d7a7f4813bc4c5a2aeb70523e9524
      OPENKM_URL: https://sec.cmcati.vn/OpenKM
      OPENKM_USER: okmAdmin
      OPENKM_PASS: ghp_X60Gn0$dd!f@$h60vtax2f8eVB
      WALLET_PASS: CMCATI@2025sec
      BC_GATEWAY_URL: core-bc-gateway-1:8080/wallet-sync/ethereum
      QUICKNODE_HTTPS: https://small-sleek-choice.ethereum-sepolia.quiknode.pro/0046e993da9e2adfcdddef4024b89cf8e298f40d/
      QUICKNODE_WSS: wss://small-sleek-choice.ethereum-sepolia.quiknode.pro/0046e993da9e2adfcdddef4024b89cf8e298f40d/
      MNEMONIC: test
      PRK: 217def1071ffc01fffc1434421fa6ae8367d01a90e3f771a71b9f551e8445fed
      SAFE_API: https://safe-transaction-sepolia.safe.global
      SAFE_ADDR: 0xF2b241342A071E1aD2A3AA36841EC6EA718C114f
    depends_on:
      - vault
      - postgres-wallet-transfer
    #      - postgres-scanner
    labels:
      collect_logs: "true"
    networks:
      - default
  captcha:
    image: ghcr.io/opexdev/captcha
    environment:
      - JAVA_OPTS=-Xmx256m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=1044
      - CONSUL_HOST=consul
      - SWAGGER_AUTH_URL=$KEYCLOAK_FRONTEND_URL
    depends_on:
      - consul
    labels:
      collect_logs: "true"
    deploy:
      restart_policy:
        condition: on-failure

  zookeeper:
    image: confluentinc/cp-zookeeper:7.1.1
    hostname: zookeeper
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOOKEEPER_CLIENT_PORT=2181
    networks:
      - default
    deploy:
      restart_policy:
        condition: on-failure
  kafka-1:
    image: ghcr.io/opexdev/kafka
    hostname: kafka-1
    volumes:
      - kafka-1:/var/lib/kafka/data
    environment:
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CLIENT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_LISTENERS=CLIENT://kafka-1:29092,EXTERNAL://kafka-1:9092
      - KAFKA_ADVERTISED_LISTENERS=CLIENT://kafka-1:29092,EXTERNAL://kafka-1:9092
      - KAFKA_INTER_BROKER_LISTENER_NAME=CLIENT
      - KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE=false
      - KAFKA_OPTS=-javaagent:/opt/prometheus/jmx-exporter.jar=1234:/opt/prometheus/kafka-jmx-exporter.yml
    depends_on:
      - zookeeper
    networks:
      - default
    deploy:
      restart_policy:
        condition: on-failure
  kafka-2:
    image: ghcr.io/opexdev/kafka
    hostname: kafka-2
    volumes:
      - kafka-2:/var/lib/kafka/data
    environment:
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CLIENT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_LISTENERS=CLIENT://kafka-2:29092,EXTERNAL://kafka-2:9092
      - KAFKA_ADVERTISED_LISTENERS=CLIENT://kafka-2:29092,EXTERNAL://kafka-2:9092
      - KAFKA_INTER_BROKER_LISTENER_NAME=CLIENT
      - KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE=false
      - KAFKA_OPTS=-javaagent:/opt/prometheus/jmx-exporter.jar=1234:/opt/prometheus/kafka-jmx-exporter.yml
    depends_on:
      - zookeeper
    networks:
      - default
    deploy:
      restart_policy:
        condition: on-failure
  kafka-3:
    image: ghcr.io/opexdev/kafka
    hostname: kafka-3
    volumes:
      - kafka-3:/var/lib/kafka/data
    environment:
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CLIENT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_LISTENERS=CLIENT://kafka-3:29092,EXTERNAL://kafka-3:9092
      - KAFKA_ADVERTISED_LISTENERS=CLIENT://kafka-3:29092,EXTERNAL://kafka-3:9092
      - KAFKA_INTER_BROKER_LISTENER_NAME=CLIENT
      - KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE=false
      - KAFKA_OPTS=-javaagent:/opt/prometheus/jmx-exporter.jar=1234:/opt/prometheus/kafka-jmx-exporter.yml
    depends_on:
      - zookeeper
    networks:
      - default
    deploy:
      restart_policy:
        condition: on-failure
  akhq:
    image: tchiotludo/akhq:0.20.0
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            docker-kafka-server:
              properties:
                bootstrap.servers: "kafka-1:29092,kafka-2:29092,kafka-3:29092"
    networks:
      - default
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    deploy:
      restart_policy:
        condition: on-failure
  vault:
    image: ghcr.io/opexdev/vault-opex
    volumes:
      - vault-data:/vault/file
    environment:
      - VAULT_ADDR=http://0.0.0.0:8200
      - PANEL_PASS=${PANEL_PASS}
      - BACKEND_USER=${BACKEND_USER}
      - SMTP_PASS=${SMTP_PASS}
      - DB_USER=${DB_USER:-opex}
      - DB_PASS=${DB_PASS:-hiopex}
      - DB_READ_ONLY_USER=${DB_READ_ONLY_USER:-opex_reader}
      - DB_READ_ONLY_PASS=${DB_READ_ONLY_PASS:-hiopex}
      - KEYCLOAK_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME:-opex-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-hiopex}
      - OPEX_ADMIN_KEYCLOAK_CLIENT_SECRET=${OPEX_ADMIN_KEYCLOAK_CLIENT_SECRET}
      - VANDAR_API_KEY=$VANDAR_API_KEY
    cap_add:
      - IPC_LOCK
    deploy:
      restart_policy:
        condition: on-failure
  consul:
    image: hashicorp/consul
    environment:
      - CONSUL_BIND_INTERFACE=eth0
    networks:
      - default
    deploy:
      restart_policy:
        condition: on-failure
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
      - redis.conf:/usr/local/etc/redis/redis.conf
    environment:
      - REDIS_REPLICATION_MODE=master
    networks:
      - default
    deploy:
      restart_policy:
        condition: on-failure
  redis-duo:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-duo-data:/data
      - redis-duo.conf:/usr/local/etc/redis/redis.conf
    environment:
      - REDIS_REPLICATION_MODE=master
    networks:
      - default
    deploy:
      restart_policy:
        condition: on-failure
  redis-cache:
    image: redis/redis-stack:latest
    volumes:
      - redis-cache-data:/data
    environment:
      - REDIS_REPLICATION_MODE=master
    networks:
      - default
    deploy:
      restart_policy:
        condition: on-failure
  postgres-accountant:
    <<: *postgres-db
    volumes:
      - accountant-data:/var/lib/postgresql/data/
    ports:
      - "5430:5432"
  postgres-eventlog:
    <<: *postgres-db
    volumes:
      - eventlog-data:/var/lib/postgresql/data/
  postgres-auth:
    <<: *postgres-db
    volumes:
      - auth-data:/var/lib/postgresql/data/
  postgres-wallet:
    <<: *postgres-db
    volumes:
      - wallet-data:/var/lib/postgresql/data/
    ports:
      - "5428:5432"
  postgres-market:
    <<: *postgres-db
    volumes:
      - market-data:/var/lib/postgresql/data/
    ports:
      - "5427:5432"
  postgres-api:
    <<: *postgres-db
    volumes:
      - api-data:/var/lib/postgresql/data/
    ports:
      - "5426:5432"
  postgres-bc-gateway:
    <<: *postgres-db
    volumes:
      - bc-gateway-data:/var/lib/postgresql/data/
    ports:
      - "5429:5432"
  accountant:
    image: ghcr.io/opexdev/accountant
    environment:
      - JAVA_OPTS=-Xmx512m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      - SPRING_PROFILES_ACTIVE=scheduled
      - KAFKA_IP_PORT=kafka-1:29092,kafka-2:29092,kafka-3:29092
      - CONSUL_HOST=consul
      - DB_IP_PORT=postgres-accountant
      - BACKEND_USER=${BACKEND_USER}
      - VAULT_HOST=vault
      - SWAGGER_AUTH_URL=$KEYCLOAK_FRONTEND_URL
      - PREFERENCES=$PREFERENCES
    configs:
      - preferences.yml
    networks:
      - default
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
      - wallet
      - consul
      - vault
      - postgres-accountant
    labels:
      collect_logs: "true"
    deploy:
      restart_policy:
        condition: on-failure
  eventlog:
    image: ghcr.io/opexdev/eventlog
    environment:
      - JAVA_OPTS=-Xmx256m
      - KAFKA_IP_PORT=kafka-1:29092,kafka-2:29092,kafka-3:29092
      - CONSUL_HOST=consul
      - DB_IP_PORT=postgres-eventlog
      - BACKEND_USER=${BACKEND_USER}
      - VAULT_HOST=vault
    networks:
      - default
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
      - consul
      - vault
      - postgres-eventlog
    labels:
      collect_logs: "true"
    deploy:
      restart_policy:
        condition: on-failure
  matching-engine:
    image: ghcr.io/opexdev/matching-engine
    environment:
      - JAVA_OPTS=-Xmx256m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      - KAFKA_IP_PORT=kafka-1:29092,kafka-2:29092,kafka-3:29092
      - REDIS_HOST=redis
      - SYMBOLS=BTC_USDT,ETH_USDT,BTC_IRT,ETH_IRT,USDT_IRT,ETH_BUSD,BTC_BUSD,BNB_BUSD
      - PREFERENCES=$PREFERENCES
    configs:
      - preferences.yml
    networks:
      - default
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
      - redis
    labels:
      collect_logs: "true"
    deploy:
      restart_policy:
        condition: on-failure
  matching-engine-duo:
    image: ghcr.io/opexdev/matching-engine
    environment:
      - JAVA_OPTS=-Xmx256m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      - KAFKA_IP_PORT=kafka-1:29092,kafka-2:29092,kafka-3:29092
      - REDIS_HOST=redis-duo
      - SYMBOLS=SOL_USDT,DOGE_USDT,TON_USDT
      - PREFERENCES=$PREFERENCES
    configs:
      - preferences.yml
    networks:
      - default
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
      - redis-duo
    labels:
      collect_logs: "true"
    deploy:
      restart_policy:
        condition: on-failure
  matching-gateway:
    image: ghcr.io/opexdev/matching-gateway
    environment:
      - JAVA_OPTS=-Xmx256m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      - KAFKA_IP_PORT=kafka-1:29092,kafka-2:29092,kafka-3:29092
      - CONSUL_HOST=consul
    networks:
      - default
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
      - auth
      - consul
      - matching-engine
    labels:
      collect_logs: "true"
    deploy:
      restart_policy:
        condition: on-failure
  auth:
    image: ghcr.io/opexdev/auth
    environment:
      - JAVA_OPTS=-Xmx256m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      - KAFKA_IP_PORT=kafka-1:29092,kafka-2:29092,kafka-3:29092
      - CONSUL_HOST=consul
      - DB_IP_PORT=postgres-auth
      - BACKEND_USER=$BACKEND_USER
      - ADMIN_URL=$KEYCLOAK_ADMIN_URL
      - FRONTEND_URL=$KEYCLOAK_FRONTEND_URL
      - VERIFY_REDIRECT_URL=$KEYCLOAK_VERIFY_REDIRECT_URL
      - FORGOT_REDIRECT_URL=$KEYCLOAK_FORGOT_REDIRECT_URL
      - VAULT_URL=http://vault:8200
      - VAULT_HOST=vault
      - PREFERENCES=$PREFERENCES
      - APP_NAME=$APP_NAME
      - APP_BASE_URL=$APP_BASE_URL
      - WHITELIST_REGISTER_ENABLED=$WHITELIST_REGISTER_ENABLED
      - WHITELIST_LOGIN_ENABLED=$WHITELIST_LOGIN_ENABLED
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
      - consul
      - vault
      - postgres-auth
    networks:
      - default
    labels:
      collect_logs: "true"
    deploy:
      restart_policy:
        condition: on-failure
  wallet:
    image: ghcr.io/opexdev/wallet
    environment:
      - JAVA_OPTS=-Xmx512m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      - KAFKA_IP_PORT=kafka-1:29092,kafka-2:29092,kafka-3:29092
      - CONSUL_HOST=consul
      - DB_IP_PORT=postgres-wallet
      - BACKEND_USER=${BACKEND_USER}
      - VAULT_HOST=vault
      - SWAGGER_AUTH_URL=$KEYCLOAK_FRONTEND_URL
      - PREFERENCES=$PREFERENCES
      - DRIVE_FOLDER_ID=$DRIVE_FOLDER_ID
      - BACKUP_ENABLED=$WALLET_BACKUP_ENABLED
    configs:
      - preferences.yml
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
      - auth
      - consul
      - vault
      - postgres-wallet
    networks:
      - default
    labels:
      collect_logs: "true"
    deploy:
      restart_policy:
        condition: on-failure
  market:
    image: ghcr.io/opexdev/market
    environment:
      - JAVA_OPTS=-Xmx512m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      - KAFKA_IP_PORT=kafka-1:29092,kafka-2:29092,kafka-3:29092
      - CONSUL_HOST=consul
      - DB_IP_PORT=postgres-market
      - BACKEND_USER=${BACKEND_USER}
      - VAULT_HOST=vault
      - SWAGGER_AUTH_URL=$KEYCLOAK_FRONTEND_URL
      - PREFERENCES=$PREFERENCES
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
      - auth
      - consul
      - vault
      - postgres-market
      - redis-cache
    networks:
      - default
    labels:
      collect_logs: "true"
    deploy:
      restart_policy:
        condition: on-failure
  api:
    image: ghcr.io/opexdev/api
    environment:
      - JAVA_OPTS=-Xmx512m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      - CONSUL_HOST=consul
      - DB_IP_PORT=postgres-api
      - BACKEND_USER=${BACKEND_USER}
      - VAULT_HOST=vault
      - SWAGGER_AUTH_URL=$KEYCLOAK_FRONTEND_URL
      - PREFERENCES=$PREFERENCES
      - API_KEY_CLIENT_SECRET=$API_KEY_CLIENT_SECRET
      - FAKE_DATA=$FAKE_DATA
    configs:
      - preferences.yml
    depends_on:
      - accountant
      - matching-gateway
      - wallet
      - market
      - auth
      - consul
      - vault
      - postgres-api
    networks:
      - default
    labels:
      collect_logs: "true"
    deploy:
      restart_policy:
        condition: on-failure
  bc-gateway:
    image: ghcr.io/opexdev/bc-gateway
    environment:
      - JAVA_OPTS=-Xmx256m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      - CONSUL_HOST=consul
      - KAFKA_IP_PORT=kafka-1:29092,kafka-2:29092,kafka-3:29092
      - DB_IP_PORT=postgres-bc-gateway
      - BACKEND_USER=${BACKEND_USER}
      - VAULT_HOST=vault
      - SWAGGER_AUTH_URL=$KEYCLOAK_FRONTEND_URL
      - PREFERENCES=$PREFERENCES
      - ADDRESS_EXP_TIME=100
    configs:
      - preferences.yml
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
      - auth
      - wallet
      - consul
      - vault
      - postgres-bc-gateway
    networks:
      - default
    labels:
      collect_logs: "true"
    deploy:
      restart_policy:
        condition: on-failure
volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-1:
  kafka-2:
  kafka-3:
  vault-data:
  redis-data:
  redis.conf:
  redis-duo-data:
  redis-duo.conf:
  redis-cache-data:
  accountant-data:
  eventlog-data:
  auth-data:
  wallet-data:
  market-data:
  api-data:
  bc-gateway-data:
  admin-data:
  storage-data:
networks:
  opex:
    external: true
  default:
    driver: bridge
secrets:
  opex_dev_crt:
    file: opex.dev.crt
  private_pem:
    file: private.pem
configs:
  preferences.yml:
    file: preferences.yml
